# class-room CI — the gates that previously only ran when someone typed
# them (`npm run verify` + the e2e tiers). Four jobs:
#
#   verify          lint + tsc + the server-action auth ratchet + build
#   e2e-mocked      the product-loop Playwright tier (MOCK_AUTH, keyless)
#   e2e-real-auth   the adversarial tier — REAL WorkOS login, anonymous
#                   rejection, captured-mutation replay. Runs only when
#                   the WorkOS secrets are configured on the repo; a
#                   missing secret skips the job's steps loudly rather
#                   than red-failing forks/fresh clones.
#
#   e2e-live-call   a REAL RealtimeKit call — two browsers on fake media
#                   devices, one room, one recording, asserting every
#                   participant produced an audio track. Same skip-on-
#                   missing-secret shape, and it spends real provider
#                   minutes when it does run.
#
# Required secrets for e2e-live-call: REALTIMEKIT_APP_ID REALTIMEKIT_API_KEY
#
# Required secrets for e2e-real-auth (Settings → Secrets → Actions):
#   WORKOS_API_KEY  WORKOS_CLIENT_ID  WORKOS_COOKIE_PASSWORD
#   E2E_TEACHER_EMAIL  E2E_TEACHER_PASSWORD
# (provision the synthetic teacher once with `npm run e2e:user`)
#
# Deploy jobs (ported from the crm pipeline): pushes to main deploy
# production, pushes to develop deploy a Preview aliased to
# dev-classroom.jurisimus.com — each only after every test job is
# green. Gated on the RUN_VERCEL_DEPLOY repo variable + the
# VERCEL_TOKEN repo secret (same team-scoped token as the crm repo),
# so the workflow lands green before those exist. Vercel's own
# push-triggered auto-deploys are OFF (vercel.json
# git.deploymentEnabled:false) — this pipeline is the only deployer.
name: ci
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build

  e2e-mocked:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: classroom
          POSTGRES_PASSWORD: classroom
          POSTGRES_DB: classroom
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U classroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://classroom:classroom@localhost:5439/classroom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      # db:seed goes through tsx --env-file=.env.local, which hard-fails
      # when the file is absent — call the scripts directly; DATABASE_URL
      # is already in the job env.
      - run: npx tsx scripts/seed.ts
      # Curated packs are DB CONTENT, not schema — the packs e2e needs
      # the catalog synced.
      - run: npx tsx scripts/seed-packs.ts
      # So is the learning-path catalog, and for the same reason. Deploy
      # already runs both (`vercel-build` = migrate + packs + paths); CI
      # ran only packs, so `/path` rendered an empty tree and every
      # path-progress spec failed on `.path-hub` count 0. The damage did
      # not stop there: that file's `beforeAll` calls `resetMockLearner()`,
      # and Playwright re-runs `beforeAll` on the fresh worker it takes
      # after any failure — so each retry wiped the learner study.spec was
      # working with, and nine specs in another file went red for a reason
      # that was never in them.
      - run: npx tsx scripts/seed-paths.ts
      - run: npm run test:e2e
      # Same reason as the live-call tier: an eight-test cascade after a
      # hydration mismatch on /students (2026-09-02, be1e661) left no DOM
      # to read and did not reproduce on the next push or locally.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mocked-test-results
          path: test-results/
          retention-days: 7

  e2e-real-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: classroom
          POSTGRES_PASSWORD: classroom
          POSTGRES_DB: classroom
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U classroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://classroom:classroom@localhost:5439/classroom
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
      WORKOS_COOKIE_PASSWORD: ${{ secrets.WORKOS_COOKIE_PASSWORD }}
      WORKOS_COOKIE_NAME: classroom-wos-session
      NEXT_PUBLIC_WORKOS_REDIRECT_URI: http://localhost:3020/callback
      E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
      E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check real-auth secrets
        id: creds
        run: |
          if [ -n "$WORKOS_API_KEY" ] && [ -n "$E2E_TEACHER_EMAIL" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::real-auth secrets not configured — tier skipped"
          fi
      - if: steps.creds.outputs.has == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.has == 'true'
        run: npm ci
      - if: steps.creds.outputs.has == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.creds.outputs.has == 'true'
        run: npm run db:migrate
      - if: steps.creds.outputs.has == 'true'
        run: npm run test:e2e:real-auth

  e2e-live-call:
    # A REAL RealtimeKit call: two browsers on fake media devices, one
    # room, one recording. Runs only when provider credentials are
    # configured and self-skips loudly otherwise — the same shape as
    # e2e-real-auth, for the same reason: a fork or a fresh clone must
    # not go red over a secret it cannot have.
    #
    # It is NOT free. Each run spends a couple of minutes of participant
    # and audio-export time (pennies at pilot scale). If that stops being
    # worth it per push, move it to a schedule rather than deleting it:
    # the failure it guards is SILENT — a track recording whose allowlist
    # matches nobody reports UPLOADED with a real duration and no error,
    # and contains no audio at all. No mocked tier can see that.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: classroom
          POSTGRES_PASSWORD: classroom
          POSTGRES_DB: classroom
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U classroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://classroom:classroom@localhost:5439/classroom
      REALTIMEKIT_APP_ID: ${{ secrets.REALTIMEKIT_APP_ID }}
      REALTIMEKIT_API_KEY: ${{ secrets.REALTIMEKIT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check provider credentials
        id: creds
        run: |
          if [ -n "$REALTIMEKIT_APP_ID" ] && [ -n "$REALTIMEKIT_API_KEY" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RealtimeKit secrets not configured — live-call tier skipped"
          fi
      - if: steps.creds.outputs.has == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.has == 'true'
        run: npm ci
      - if: steps.creds.outputs.has == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.creds.outputs.has == 'true'
        run: npm run db:migrate
      - if: steps.creds.outputs.has == 'true'
        run: npm run test:e2e:live-call
      # The trace is the only way to see what a real call did on a runner
      # six times slower than a laptop. On 2026-09-02 this tier failed
      # twice with "Stop button found, never clickable" and nothing to
      # look at; the local run of the same spec passed in 1.4 minutes.
      - if: failure() && steps.creds.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-call-test-results
          path: test-results/
          retention-days: 7


  deploy:
    # Production deploy — pushes to main only, after every test job is
    # green. (e2e-real-auth self-skips its steps when secrets are
    # missing but still reports success, so it gates cleanly either
    # way.) Implementation lives in deploy.yml — the same file is the
    # manual deploy/rollback button in the Actions tab.
    needs: [verify, e2e-mocked, e2e-real-auth, e2e-live-call]
    if: >-
      ${{ !cancelled() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.RUN_VERCEL_DEPLOY == 'true' &&
          needs.verify.result == 'success' &&
          needs['e2e-mocked'].result == 'success' &&
          needs['e2e-real-auth'].result == 'success' &&
          needs['e2e-live-call'].result == 'success' }}
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
      target: production
    secrets: inherit

  deploy-dev:
    # Dev-env deploy — pushes to develop only, same all-green gate.
    # Deploys a PREVIEW deployment (Vercel's Preview env scope supplies
    # the dev vars) and aliases dev-classroom.jurisimus.com to it.
    needs: [verify, e2e-mocked, e2e-real-auth, e2e-live-call]
    if: >-
      ${{ !cancelled() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/develop' &&
          vars.RUN_VERCEL_DEPLOY == 'true' &&
          needs.verify.result == 'success' &&
          needs['e2e-mocked'].result == 'success' &&
          needs['e2e-real-auth'].result == 'success' &&
          needs['e2e-live-call'].result == 'success' }}
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.sha }}
      target: preview
    secrets: inherit
